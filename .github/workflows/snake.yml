name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # Daily
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate GitHub Contribution Grid Snake (dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: amaannn08
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#F7A41D&color_dots=#0D1117,#1F2937,#374151,#4B5563,#6B7280
            dist/github-contribution-grid-snake-dark.svg?color_snake=#F7A41D&color_dots=#161B22,#30363D,#484F58,#6E7681
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
          destination_dir: .
